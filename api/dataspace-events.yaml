openapi: 3.0.3
info:
  title: Data Space Events API
  description: Receiving endpoint for data space events, delivered as CloudEvents 1.0 (structured mode) via the CloudEvents
    HTTP webhook binding, and the CloudEvents-Subscriptions-shaped API through which participants subscribe to the events
    of this instance.
  version: 0.0.1
tags:
  - name: events
  - name: subscriptions
paths:
  /events:
    post:
      tags:
        - events
      operationId: receiveEvent
      summary: Receive a data space event
      description: Accepts a CloudEvent from an authorized data space participant. The bearer token issued by the verifier
        identifies the participant, which has to match the event source.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/DataSpaceEvent'
      responses:
        '202':
          description: The event was accepted. Also returned for duplicates, unknown types and events about the receiver itself.
        '400':
          description: The event is malformed.
        '401':
          description: No valid bearer token was presented.
        '403':
          description: The participant is not allowed to publish this event.
        '415':
          description: The request is not a structured-mode CloudEvent.
        '500':
          description: The event could not be handled. The publisher may retry.
        '503':
          description: An event with the same source and id is still being processed. The publisher should retry later.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
    options:
      tags:
        - events
      operationId: validateWebhook
      summary: CloudEvents webhook validation
      description: Abuse protection handshake of the CloudEvents HTTP webhook specification.
      parameters:
        - name: WebHook-Request-Origin
          in: header
          required: false
          description: DNS name of the sender asking for permission to deliver events.
          schema:
            type: string
      responses:
        '200':
          description: Lists the allowed methods and, if the requesting origin is a configured publisher, the allowed origin.
          headers:
            Allow:
              description: Methods allowed on the endpoint.
              schema:
                type: string
            WebHook-Allowed-Origin:
              description: The origin that is allowed to deliver events.
              schema:
                type: string
  /subscriptions:
    post:
      tags:
        - subscriptions
      operationId: createSubscription
      summary: Subscribe to data space events
      description: Creates or renews a subscription of the authenticated participant. The sink has to pass the CloudEvents
        webhook handshake before the subscription is activated. A request by the same subscriber for the same sink renews
        the existing subscription in place.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: The subscription was created or renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: The request is invalid or the sink did not pass the webhook handshake.
        '401':
          description: No valid bearer token was presented.
        '403':
          description: The subscriberId does not match the participant identified by the bearer token.
        '409':
          description: The maximum number of subscriptions is reached.
        '503':
          description: The verifier is unavailable. The subscriber should retry later.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /subscriptions/{subscriptionId}:
    delete:
      tags:
        - subscriptions
      operationId: deleteSubscription
      summary: Unsubscribe
      description: Removes a subscription of the authenticated participant.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The subscription was removed.
        '401':
          description: No valid bearer token was presented.
        '404':
          description: No subscription with this id is owned by the participant.
        '503':
          description: The verifier is unavailable. The subscriber should retry later.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DataSpaceEvent:
      type: object
      description: CloudEvents 1.0 envelope of a data space event.
      properties:
        specversion:
          type: string
          enum:
            - '1.0'
        id:
          type: string
          description: Unique per source.
          example: 4f1c3a1e-5d0b-4d7e-9a43-2a8b0f6c9e11
        source:
          type: string
          description: Participant id of the publisher.
          example: did:web:provider.org
        type:
          type: string
          example: org.fiware.dataspace.example
        subject:
          type: string
          description: Participant id the event is about.
          example: did:web:consumer.org
        time:
          type: string
          format: date-time
          example: '2026-07-21T17:32:28Z'
        datacontenttype:
          type: string
          example: application/json
        dataschema:
          type: string
        dataspaceid:
          type: string
          description: Extension attribute identifying the data space the event belongs to.
        data:
          description: Event payload, any JSON value. Interpreted by the handler of the event type.
      required:
        - specversion
        - id
        - source
        - type
    SubscriptionRequest:
      type: object
      description: Subscription to data space events, shaped after CloudEvents Subscriptions.
      properties:
        subscriberId:
          type: string
          description: Participant id of the subscriber. Has to match the bearer token.
          example: did:web:consumer.org
        sink:
          type: string
          format: uri
          description: Webhook the events are delivered to.
          example: https://events.consumer.org/events
        types:
          type: array
          minItems: 1
          description: Event types to deliver.
          items:
            type: string
            example: org.fiware.dataspace.example
        protocol:
          type: string
          description: Delivery protocol. Only HTTP is supported.
          enum:
            - HTTP
        protocolsettings:
          $ref: '#/components/schemas/HttpProtocolSettings'
      required:
        - subscriberId
        - sink
        - types
    HttpProtocolSettings:
      type: object
      description: Authentication towards the sink. If the sink answers 401, an OID4VP token is fetched for this client and these scopes.
      properties:
        clientId:
          type: string
          example: contract-management
        scopes:
          type: array
          items:
            type: string
            example: default
    Subscription:
      type: object
      description: An active subscription.
      properties:
        id:
          type: string
          example: 9b2e1f6a-0c41-4d55-8a3e-7d2f5c1b0e88
        subscriberId:
          type: string
          example: did:web:consumer.org
        sink:
          type: string
          format: uri
          example: https://events.consumer.org/events
        types:
          type: array
          items:
            type: string
            example: org.fiware.dataspace.example
        protocol:
          type: string
          description: Delivery protocol. Only HTTP is supported.
          enum:
            - HTTP
        protocolsettings:
          $ref: '#/components/schemas/HttpProtocolSettings'
        expiresAt:
          type: string
          format: date-time
          description: End of the lease. Renew before to keep the subscription.
          example: '2026-07-22T17:32:28Z'
      required:
        - id
        - subscriberId
        - sink
        - types
        - expiresAt
