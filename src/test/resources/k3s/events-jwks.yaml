# Static JWKS standing in for the verifier's, used by contract-management-provider to check data space event tokens.
# The private key is src/test/resources/dataspace/events-verifier-key.json, used by InContainerDataSpaceEventsIT.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: events-jwks
  name: events-jwks
data:
  jwks.json: |
    {"keys": [{"kty": "EC", "crv": "P-256", "kid": "events-verifier-key", "alg": "ES256", "use": "sig", "x": "-OJrTaI62dqS_7eEHoF8D-gGo5ORdwW9O-oTwEOojRw", "y": "O-wTU7N8SGCrmC_63YgCRbQ_5NChH9YBZNXo01xKZcc"}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: events-jwks
  name: events-jwks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-jwks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-jwks
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /jwks.json
              port: http
          volumeMounts:
            - name: jwks
              mountPath: /usr/share/nginx/html
      volumes:
        - name: jwks
          configMap:
            name: events-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: events-jwks
  labels:
    app.kubernetes.io/name: events-jwks
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: events-jwks
