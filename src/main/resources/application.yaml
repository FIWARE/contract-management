micronaut:
  application:
    name: ${project.artifactId}

  server:
    port: 8080

  metrics:
    enabled: true
    export:
      prometheus:
        step: PT2s
        descriptions: false

  codec:
    json:
      # data space events arrive as structured CloudEvents
      additional-types:
        - application/cloudevents+json

  io:
    # file watch behind dataspace.events.listener.watch, see ConfigFileRefresher
    watch:
      enabled: ${dataspace.events.listener.watch.enabled:false}
      paths: ${dataspace.events.listener.watch.path:}

  executors:
    notification-subscriber:
      type: scheduled
      core-pool-size: 1

  http:
    services:
      rainbow:
        path: "/"
        url: http://localhost:1234
        read-timeout: 30
      product-order:
        path: "/tmf-api/productOrderingManagement/v4"
        url: http://localhost:8081
        read-timeout: 30
      party:
        path: "/tmf-api/party/v4"
        url: http://localhost:8083
        read-timeout: 30
      product-catalog:
        path: "/tmf-api/productCatalogManagement/v4"
        url: http://localhost:8082
        read-timeout: 30
      service-catalog:
        path: "/tmf-api/serviceCatalogManagement/v4"
        url: http://localhost:8084
        read-timeout: 30
      trusted-issuers-list:
        path: "/"
        url: http://localhost:8085
        read-timeout: 30
      tmforum-agreement-api:
        path: "/tmf-api/agreementManagement/v4"
        url: http://localhost:8086
        read-timeout: 30
      quote:
        path: "/tmf-api/quote/v4"
        url: http://localhost:8087
        read-timeout: 30
      odrl:
        path: ""
        url: http://localhost:8088
        read-timeout: 30

http:
  client:
    log-exception: false
  server:
    log:
      exclude-paths:
        - /health
        - /metrics
        - /prometheus

general:
  did: did:test:did
  productOrder:
    customerRole: "customer"
  organization:
    provider:
      role: "provider"
oid4vp:
  enabled: false
  enableRevocation: false
